<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" fill="none">
    <rect width="480" height="220" rx="20" fill="#050B14"/>
    <rect width="480" height="220" rx="20" fill="url(#bgGrad-productssolarinverterssvg)"/>
